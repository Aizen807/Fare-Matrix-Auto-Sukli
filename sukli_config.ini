; ============================================================
; CONTROL BUTTON IMAGES - For Image Detection
; ============================================================
[ControlButtons]
; These are the ONLY images you need to capture!
reset=reset_arrow.png
check=check_button.png

; ============================================================
; DENOMINATION BUTTON POSITIONS - Auto-Calibrated
; ============================================================
[DenomPositions]
; These values are auto-calibrated when you use the Calibrate feature
; They represent the position of each sukli button as a percentage
; of the Roblox window size (0.00 to 1.00)
; 
; X = percentage from the LEFT of the window
; Y = percentage from the TOP of the window
;
; Default values (you can adjust manually if needed):
50_X=0.30
50_Y=0.40
20_X=0.40
20_Y=0.40
10_X=0.50
10_Y=0.40
5_X=0.60
5_Y=0.40
1_X=0.70
1_Y=0.40

; ============================================================
; SUKLI DENOMINATION IMAGES - Optional (for better reliability)
; ============================================================
; If you want to use image detection instead of coordinates
; for clicking the denomination buttons, uncomment these:
; [DenominationImages]
; 50=sukli_50.png
; 20=sukli_20.png
; 10=sukli_10.png
; 5=sukli_5.png
; 1=sukli_1.png

; ============================================================
; NOTES
; ============================================================
; 1. The macro currently uses COORDINATE-BASED clicking for
;    denomination buttons (50, 20, 10, 5, 1) - no images needed!
;
; 2. You only need to capture TWO images:
;    - reset_arrow.png
;    - check_button.png
;
; 3. Use the Calibrate feature (button in the GUI) to auto-set
;    the denomination button positions.
;
; 4. All images go in the sukli_images/ folder.
; ============================================================
