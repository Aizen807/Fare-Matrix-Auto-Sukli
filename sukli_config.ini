; ============================================================
; SUKLI CONFIGURATION - ALL ROUTES (FINAL)
; ============================================================
; This is the master config – it lists all destinations,
; image filenames, fare rules, and button positions.
;
; IMPORTANT:
; 1. Place this file in the SAME folder as SukliAutomation.ahk
; 2. Images must be placed in:
;    - sukli_images_1366\  (for 1366×768 captures)
;    - sukli_images_1920\  (for 1920×1080 captures)
; 3. Button images go in sukli_buttons_1366\ and sukli_buttons_1920\
; 4. Calibrate F6 & F7 at your current resolution and save a profile.
; 5. Use the Resolution dropdown in the GUI to select your screen size.
; ============================================================

[Settings]
; Reference resolution (used only as fallback; the script now uses the dropdown)
ScreenWidth=1920
ScreenHeight=1080

; Active route (can be changed via GUI or profile)
Route=Balagtas

; Full Auto = 1 means fully automatic
FullAuto=1

; ImageSearch color-variation tolerance (0-255). Higher = more forgiving.
; Keep this LOW (30-50) for reliable text/UI matching. Going too high (100+)
; causes false-positive matches between different destinations/labels that
; happen to have similar overall shading, even if the actual text differs.
ImageVariation=70

; ============================================================
; ROUTES – define which destinations belong to each route
; (Add or remove destinations here – the script will pick them up automatically)
; ============================================================
[Routes]
Balagtas=Bagumbayan/San Jose,Matungao,Panginay Guiguinto,Panginay Balagtas,Wawa
Guiguinto=Bagumbayan/San Jose,Matungao,Tuktukan
Malolos=Bagumbayan/San Jose,Maysantol,San Nicolas,Pitpitan,Mambog,Matimbo,Panasahan,Bagna,Atlag,San Juan/Sto. Rosario

; ============================================================
; FARES – Configure your fares here
; ============================================================
[Fares]
Regular=13
Student=11
Senior=11
Extra=2
MinimumUnits=4

; ============================================================
; DENOMINATION BUTTON POSITIONS – set by pressing F6 in-game
; These are RELATIVE coordinates (0.0 to 1.0) of the bill buttons
; These values are PLACEHOLDERS – you MUST press F6 to calibrate!
; ============================================================
