; ============================================================
; SUKLI CONFIGURATION - Fare Matrix Auto Sukli
; ============================================================
; Edit this file with your settings before running the macro.
; All values are explained below.
; ============================================================

; ============================================================
; SETTINGS - Basic Configuration
; ============================================================
[Settings]
; Your screen resolution (width x height)
; Make sure this matches your actual screen resolution
; Common resolutions: 1920x1080, 1366x768, 2560x1440, etc.
ScreenWidth=1920
ScreenHeight=1080

; Select your route: Balagtas, Guiguinto, or Malolos
; This determines which barangays are available for the fare calculation
Route=Balagtas

; Pixel color of "Naghihintay ng sukli" text on the sukli screen
; Use AutoHotkey's Window Spy tool to find this color
; 1. Run the AHK script
; 2. Right-click the tray icon -> Open
; 3. Go to View -> Window Spy
; 4. Hover over the "Naghihintay ng sukli" text in Roblox
; 5. Copy the color value (e.g., 0xFFFFFF for white)
; Default: 0xFFFFFF (white)
SukliColor=0xFFFFFF

; Color tolerance for detection (0-255)
; Higher values = more forgiving (detects similar colors)
; Lower values = more strict (requires exact match)
; Recommended: 5-20 for most setups
ColorTolerance=10

; Detection interval in milliseconds (how often to check)
; Lower = faster detection, higher = less CPU usage
; Recommended: 300-500ms
DetectionInterval=500

; ============================================================
; FARES - Fare Calculation Settings
; ============================================================
[Fares]
; Base fare for the first 4 barangays
Regular=13
Student=11
Senior=11

; Additional fare per extra barangay (beyond the first 4)
Extra=2

; Minimum number of units for base fare
MinimumUnits=4

; ============================================================
; ROUTE DATA - Barangay Lists for Each Route
; ============================================================
[Routes]
; Balagtas Route (5 barangays)
Balagtas=Bagumbayan/San Jose,Matungao,Panginay Guiguinto,Panginay Balagtas,Wawa

; Guiguinto Route (3 barangays)
Guiguinto=Bagumbayan/San Jose,Matungao,Tuktukan

; Malolos Route (10 barangays)
Malolos=Bagumbayan/San Jose,Maysantol,San Nicolas,Pitpitan,Mambog,Matimbo,Panasahan,Bagna,Atlag,San Juan/Sto. Rosario

; ============================================================
; PASSENGER TYPE IMAGES - For Image Detection
; ============================================================
; These images are used to detect the passenger type
; Place these images in the sukli_images/ folder
; ============================================================
[PassengerTypes]
; Image for "Student" or "Studyante" text
Student=type_student.png

; Image for "Senior" text
Senior=type_senior.png

; ============================================================
; CONTROL BUTTON IMAGES - For Image Detection
; ============================================================
; These are the images the macro uses to find buttons
; Place these images in the sukli_images/ folder
; ============================================================
[ControlButtons]
; Reset button (red arrow)
Reset=reset_arrow.png

; Check/Sukli button
Check=check_button.png

; ============================================================
; DENOMINATION BUTTON POSITIONS - Auto-Calibrated
; ============================================================
; These values are auto-calibrated when you use the Calibrate feature
; They represent the position of each sukli button as a percentage
; of the Roblox window size (0.00 to 1.00)
; 
; X = percentage from the LEFT of the window
; Y = percentage from the TOP of the window
;
; Default values (you can adjust manually if needed):
; ============================================================
[DenomPositions]
50_X=0.30
50_Y=0.40
20_X=0.40
20_Y=0.40
10_X=0.50
10_Y=0.40
5_X=0.60
5_Y=0.40
1_X=0.70
1_Y=0.40

; ============================================================
; DESTINATION IMAGES - Optional (For Future Use)
; ============================================================
; These are for future image-based destination detection
; Currently the macro uses user input for destination
; ============================================================
[Destinations]
Bagumbayan/San Jose=dest_bagumbayan.png
Matungao=dest_matungao.png
Panginay Guiguinto=dest_panginay_guiguinto.png
Panginay Balagtas=dest_panginay_balagtas.png
Wawa=dest_wawa.png
Tuktukan=dest_tuktukan.png
Maysantol=dest_maysantol.png
San Nicolas=dest_san_nicolas.png
Pitpitan=dest_pitpitan.png
Mambog=dest_mambog.png
Matimbo=dest_matimbo.png
Panasahan=dest_panasahan.png
Bagna=dest_bagna.png
Atlag=dest_atlag.png
San Juan/Sto. Rosario=dest_san_juan.png

; ============================================================
; PASSENGER COUNT IMAGES - Optional (For Future Use)
; ============================================================
; Currently the macro uses user input for passenger count
; ============================================================
[PassengerCounts]
1=count_1.png
2=count_2.png
3=count_3.png
4=count_4.png
5=count_5.png
6=count_6.png
7=count_7.png
8=count_8.png
9=count_9.png
10=count_10.png

; ============================================================
; PAYMENT AMOUNT IMAGES - Optional (For Future Use)
; ============================================================
; Currently the macro uses user input for payment amount
; ============================================================
[PaymentImages]
20=payment_20.png
50=payment_50.png
100=payment_100.png
200=payment_200.png
500=payment_500.png
1000=payment_1000.png

; ============================================================
; NOTES
; ============================================================
; 1. The macro uses IMAGE DETECTION for passenger type:
;    - type_student.png -> Student
;    - type_senior.png -> Senior
;    - Neither found -> Regular (default)
;
; 2. You need to capture 4 images total:
;    - reset_arrow.png
;    - check_button.png
;    - type_student.png  (capture "Student" or "Studyante" text)
;    - type_senior.png   (capture "Senior" text)
;
; 3. Use the Calibrate feature (button in the GUI) to auto-set
;    the denomination button positions.
;
; 4. All images go in the sukli_images/ folder.
;
; 5. How to capture type_student.png:
;    - Go to sukli screen with a Student passenger
;    - Use Snipping Tool to capture the "Student" or "Studyante" text
;    - Crop tightly around the text
;    - Save as type_student.png
;
; 6. How to capture type_senior.png:
;    - Go to sukli screen with a Senior passenger
;    - Use Snipping Tool to capture the "Senior" text
;    - Crop tightly around the text
;    - Save as type_senior.png
; ============================================================
